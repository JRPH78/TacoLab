<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 761 195" width="761" height="195">
  <title>KBPC icon</title>
  <desc>Four rounded square tiles with the letters K, B, C and P.</desc>

  <!-- Background -->
  <rect width="761" height="195" fill="#090909"/>

  <!-- Yellow tiles -->
  <rect x="25" y="18" width="158" height="157" rx="20"
        fill="none" stroke="#FFC400" stroke-width="4"/>
  <rect x="213" y="18" width="158" height="157" rx="20"
        fill="none" stroke="#FFC400" stroke-width="4"/>

  <!-- Green tiles -->
  <rect x="405" y="18" width="158" height="157" rx="20"
        fill="none" stroke="#35D06F" stroke-width="4"/>
  <rect x="593" y="18" width="158" height="157" rx="20"
        fill="none" stroke="#35D06F" stroke-width="4"/>

  <!-- Letters -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-size="60" font-weight="700"
     text-anchor="middle" dominant-baseline="middle">
    <text x="104" y="99" fill="#FFC400">K</text>
    <text x="292" y="99" fill="#FFC400">B</text>
    <text x="484" y="99" fill="#35D06F">C</text>
    <text x="672" y="99" fill="#35D06F">P</text>
  </g>
</svg>
