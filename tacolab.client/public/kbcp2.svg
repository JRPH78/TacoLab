<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400"
     width="400"
     height="400">

  <title>KBCP Icon</title>
  <desc>KB arriba y CP abajo formando un cuadrado</desc>

  <!-- Fondo -->
  <rect width="400" height="400" fill="#090909"/>

  <!-- Marco superior izquierdo -->
  <rect x="20" y="20"
        width="175" height="175"
        rx="22"
        fill="none"
        stroke="#FFC400"
        stroke-width="8"/>

  <!-- Marco superior derecho -->
  <rect x="205" y="20"
        width="175" height="175"
        rx="22"
        fill="none"
        stroke="#FFC400"
        stroke-width="8"/>

  <!-- Marco inferior izquierdo -->
  <rect x="20" y="205"
        width="175" height="175"
        rx="22"
        fill="none"
        stroke="#35D06F"
        stroke-width="8"/>

  <!-- Marco inferior derecho -->
  <rect x="205" y="205"
        width="175" height="175"
        rx="22"
        fill="none"
        stroke="#35D06F"
        stroke-width="8"/>

  <!-- Letras -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-size="125"
     font-weight="700"
     text-anchor="middle"
     dominant-baseline="middle">

    <text x="107.5" y="107.5" fill="#FFC400">K</text>
    <text x="292.5" y="107.5" fill="#FFC400">B</text>

    <text x="107.5" y="292.5" fill="#35D06F">C</text>
    <text x="292.5" y="292.5" fill="#35D06F">P</text>

  </g>

</svg>